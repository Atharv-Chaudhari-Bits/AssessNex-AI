[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "assessnex-ai"
version = "2.0.0"
description = "AssessNex AI - Platform for generating AI/ML MTech level questions using Agentic AI"
readme = "../README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-multipart==0.0.32",
    "httpx==0.28.1",
    "python-dotenv==1.2.1",
    "typing-extensions==4.15.0",
    "langchain-core==1.6.1",
    "langchain-google-genai==4.4.0",
    "langgraph==1.2.11",
    "langgraph-checkpoint==4.2.0",
    "pypdf==6.17.0",
    "python-docx==1.2.0",
]

authors = [
    {name = "AssessNex Team", email = "info@assessnex.ai"},
]

keywords = [
    "ai",
    "ml",
    "question-generation",
    "education",
    "mtech",
    "fastapi",
    "gemini",
    "langgraph",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
]

[project.urls]
Homepage = "https://assessnex.ai"
Documentation = "https://docs.assessnex.ai"
Repository = "https://github.com/assessnex/ai"
Issues = "https://github.com/assessnex/ai/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.black]
line-length = 88
target-version = ['py311', 'py312', 'py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --cov=backend --cov=frontend --cov-report=html"

[tool.coverage.run]
source = ["backend", "frontend"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/config.py",
]
